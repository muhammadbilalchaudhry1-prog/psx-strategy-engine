name: Sync PSX Market Data

on:
  push:
    branches: [ main, master ]
  schedule:
    # Runs every 15 minutes during PSX market hours (04:00 to 11:00 UTC)
    - cron: '*/15 4-11 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install psxdata pandas requests

      - name: Fetch All PSX Market Quotes
        run: |
          cat << 'EOF' > fetch.py
          import psxdata
          import pandas as pd

          try:
              print("Fetching PSX market data...")
              # Fetch all listed tickers automatically
              df = psxdata.sectors()
              
              if df is None or df.empty:
                  print("Sector fetch returned empty. Fetching individual quotes...")
                  tickers = psxdata.tickers()
                  records = []
                  for t in tickers[:125]: # Fetching top 125 tickers
                      try:
                          q = psxdata.quote(t)
                          if q:
                              records.append(q)
                      except Exception as inner_e:
                          print(f"Skipped symbol {t}: {inner_e}")
                          continue
                  df = pd.DataFrame(records)

              if not df.empty:
                  df.to_csv("psx_market_data.csv", index=False)
                  print(f"Successfully saved psx_market_data.csv with {len(df)} rows.")
              else:
                  raise Exception("Failed to fetch any market data.")

          except Exception as e:
              print(f"Error during execution: {e}")
              exit(1)
          EOF
          python fetch.py

      - name: Commit & Push CSV Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add psx_market_data.csv
          git commit -m "Auto-update PSX market CSV snapshot" || exit 0
          git push
          
