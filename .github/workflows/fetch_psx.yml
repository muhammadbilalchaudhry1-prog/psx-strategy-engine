name: Sync PSX Market Data

on:
  push:
    branches: [ main, master ]
  schedule:
    # Runs every 15 minutes during PSX market hours (04:00 to 11:00 UTC)
    - cron: '*/15 4-11 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install psx-data-reader pandas requests

      - name: Fetch PSX Stock Data
        run: |
          cat << 'EOF' > fetch.py
          import datetime
          import pandas as pd
          from psx import tickers, stocks

          try:
              print("Fetching stock ticker list...")
              all_tickers = tickers()
              
              # Limit to target list (~125 symbols) to prevent API rate limits
              target_tickers = all_tickers[:125] if len(all_tickers) >= 125 else all_tickers
              
              today = datetime.date.today()
              start_date = today - datetime.timedelta(days=5)

              print(f"Fetching market data for {len(target_tickers)} symbols...")
              df = stocks(target_tickers, start=start_date, end=today)

              if df is not None and not df.empty:
                  # Reset multi-index if returned by psx-data-reader
                  df = df.reset_index()
                  df.to_csv("psx_market_data.csv", index=False)
                  print(f"Successfully saved psx_market_data.csv with {len(df)} rows.")
              else:
                  raise Exception("Fetched DataFrame was empty.")

          except Exception as e:
              print(f"Error occurred during fetch: {str(e)}")
              exit(1)
          EOF
          python fetch.py

      - name: Commit & Push CSV Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add psx_market_data.csv
          git commit -m "Auto-update PSX market CSV snapshot" || exit 0
          git push
