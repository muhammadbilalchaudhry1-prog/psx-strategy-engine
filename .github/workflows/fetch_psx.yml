name: Sync PSX Market Data

on:
  push:
    branches: [ main, master ]
  schedule:
    # Runs every 15 minutes during PSX market hours (04:00 to 11:00 UTC)
    - cron: '*/15 4-11 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Dependencies
        run: |
          pip install pandas playwright
          playwright install chromium --with-deps

      - name: Fetch PSX Market Watch Snapshot
        run: |
          cat << 'EOF' > fetch.py
          import time
          import pandas as pd
          from playwright.sync_api import sync_playwright

          def scrape_psx():
              with sync_playwright() as p:
                  print("Launching Headless Chromium...")
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                  )
                  page = context.new_page()

                  # Capture network response directly from PSX Data Portal
                  json_data = []

                  def handle_response(response):
                      nonlocal json_data
                      if "market-watch" in response.url or "summary" in response.url:
                          try:
                              if response.status == 200 and "json" in response.headers.get("content-type", ""):
                                  data = response.json()
                                  if isinstance(data, list) and len(data) > 20:
                                      json_data = data
                                  elif isinstance(data, dict):
                                      stocks = data.get("stocks", data.get("data", []))
                                      if len(stocks) > 20:
                                          json_data = stocks
                          except Exception:
                              pass

                  page.on("response", handle_response)

                  print("Navigating to PSX Market Watch portal...")
                  page.goto("https://dps.psx.com.pk/", timeout=60000, wait_until="networkidle")
                  time.sleep(5)

                  browser.close()

                  if json_data:
                      df = pd.DataFrame(json_data)
                      df.to_csv("psx_market_data.csv", index=False)
                      print(f"Success! Generated psx_market_data.csv with {len(df)} tickers.")
                  else:
                      # Fallback mock/dummy check if block occurs
                      raise Exception("Failed to intercept JSON stream from PSX portal.")

          if __name__ == "__main__":
              scrape_psx()
          EOF
          python fetch.py

      - name: Commit & Push CSV Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add psx_market_data.csv
          git commit -m "Auto-update PSX market CSV snapshot" || exit 0
          git push
          
