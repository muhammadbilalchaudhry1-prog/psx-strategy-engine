import time
import requests

symbols = [...]  # Your list of ~125 stocks
data = []

headers = {
    "User-Agent": (
        "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
        "AppleWebKit/537.36 (KHTML, like Gecko) "
        "Chrome/120.0.0.0 Safari/537.36"
    )
}

for symbol in symbols:
    success = False
    for attempt in range(3):  # Retry up to 3 times
        try:
            # Example endpoint - adjust to match your exact endpoint URL
            url = f"https://dps.psx.com.pk/company/{symbol}"
            response = requests.get(url, headers=headers, timeout=8)

            if response.status_code == 200:
                # Process your stock data here...
                print(f"Successfully fetched {symbol}")
                success = True
                break
            else:
                print(
                    f"Attempt {attempt + 1} failed for {symbol}: Status"
                    f" {response.status_code}"
                )

        except Exception as e:
            print(f"Attempt {attempt + 1} exception for {symbol}: {e}")

        time.sleep(1.5)  # Short pause between retries

    if not success:
        print(
            f"⚠️ Skipping {symbol} after 3 failed attempts. Continuing next"
            " stock..."
        )

