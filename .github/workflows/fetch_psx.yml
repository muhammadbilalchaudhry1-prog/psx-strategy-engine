name: Sync PSX Market Data

on:
  push:
    branches: [ main, master ]
  schedule:
    # Runs every 15 minutes during PSX market hours (04:00 to 11:00 UTC)
    - cron: '*/15 4-11 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests curl_cffi pandas

      - name: Fetch PSX Summary & Save CSV
        run: |
          cat << 'EOF' > fetch.py
          import pandas as pd
          from curl_cffi import requests

          url = "https://dps.psx.com.pk/data/summary"
          try:
              res = requests.get(url, impersonate="chrome120", timeout=15)
              if res.status_code == 200:
                  data = res.json()
                  if isinstance(data, list) and len(data) > 50:
                      df = pd.DataFrame(data)
                      df.to_csv("psx_market_data.csv", index=False)
                      print(f"Successfully generated psx_market_data.csv with {len(df)} tickers.")
                  else:
                      raise Exception("Received empty or invalid JSON array.")
              else:
                  raise Exception(f"PSX Server returned status code: {res.status_code}")
          except Exception as e:
              print(f"Error fetching PSX data: {str(e)}")
              exit(1)
          EOF
          python fetch.py

      - name: Commit & Push CSV Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add psx_market_data.csv
          git commit -m "Auto-update PSX market CSV snapshot" || exit 0
          git push
