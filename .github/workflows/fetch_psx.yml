name: Sync PSX Market Data

on:
  push:
    branches: [ main, master ]
  schedule:
    # Runs every 15 minutes during PSX market hours (04:00 to 11:00 UTC)
    - cron: '*/15 4-11 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests curl_cffi pandas

      - name: Fetch PSX Summary & Save CSV
        run: |
          cat << 'EOF' > fetch.py
          import pandas as pd
          from curl_cffi import requests

          # Working PSX summary endpoint paths
          urls = [
              "https://dps.psx.com.pk/market-watch",
              "https://dps.psx.com.pk/summary"
          ]

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/javascript, */*; q=0.01",
              "X-Requested-With": "XMLHttpRequest"
          }

          success = False
          for url in urls:
              try:
                  print(f"Attempting to fetch from: {url}")
                  res = requests.get(url, headers=headers, impersonate="chrome120", timeout=15)
                  if res.status_code == 200:
                      data = res.json()
                      records = data if isinstance(data, list) else data.get("stocks", data.get("data", []))
                      if len(records) > 0:
                          df = pd.DataFrame(records)
                          df.to_csv("psx_market_data.csv", index=False)
                          print(f"Successfully generated psx_market_data.csv with {len(df)} records.")
                          success = True
                          break
              except Exception as e:
                  print(f"Failed fetching {url}: {str(e)}")

          if not success:
              print("Error: All PSX endpoints failed.")
              exit(1)
          EOF
          python fetch.py

      - name: Commit & Push CSV Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add psx_market_data.csv
          git commit -m "Auto-update PSX market CSV snapshot" || exit 0
          git push
