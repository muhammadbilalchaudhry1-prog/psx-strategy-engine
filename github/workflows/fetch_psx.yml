name: Fetch PSX Market Data

on:
  schedule:
    # Runs every 15 minutes during PSX market hours (04:00 to 11:00 UTC)
    - cron: '*/15 4-11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-psx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests curl_cffi

      - name: Fetch Market Data
        run: |
          python -c '
          import json
          from curl_cffi import requests
          
          res = requests.get("https://dps.psx.com.pk/data/summary", impersonate="chrome120", timeout=15)
          if res.status_code == 200 and len(res.json()) > 50:
              with open("psx_data.json", "w") as f:
                  json.dump(res.json(), f)
              print("PSX Data successfully synced!")
          else:
              raise Exception("Failed to fetch PSX market summary")
          '

      - name: Commit & Push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add psx_data.json
          git commit -m "Auto-update PSX market snapshot" || exit 0
          git push
          
